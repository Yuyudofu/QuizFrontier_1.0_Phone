<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUIZ FORGE 問題管理</title><link rel="stylesheet" href="admin.css"></head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">QUESTION MANAGEMENT</p><h1>QUIZ FORGE</h1></div><button id="logout" class="ghost" hidden>ログアウト</button></header>
    <section id="loginPanel" class="panel"><h2>ログイン</h2><form id="loginForm"><input id="apiBase" placeholder="API URL" value="http://localhost:3000"><input id="email" type="email" placeholder="メールアドレス" required><input id="password" type="password" placeholder="パスワード（8文字以上）" required><input id="displayName" placeholder="新規登録時の表示名（任意）"><div class="row"><button class="primary" type="submit">ログイン</button><button id="register" class="ghost" type="button">新規登録</button></div></form><p id="loginMessage" class="message"></p></section>
    <section id="appPanel" hidden><div class="toolbar"><div><h2>問題管理</h2><p id="status"></p></div><button id="addQuestion" class="primary">＋ 問題を追加</button></div><div class="filters"><input id="search" placeholder="問題・答えを検索"><select id="deckFilter"><option value="all">すべてのセット</option></select><select id="deckSelect"></select><button id="newDeck" class="ghost">＋ セット</button></div><div id="questionList" class="list"></div></section>
  </main>
  <dialog id="editor"><form method="dialog" id="editorForm"><h2 id="editorTitle">問題を追加</h2><input id="questionId" type="hidden"><label>問題<textarea id="questionText" required></textarea></label><label>答え<textarea id="answerText" required></textarea></label><label>問題セット<select id="questionDecks" multiple></select></label><div class="row"><button class="ghost" value="cancel">キャンセル</button><button class="primary" value="default">保存</button></div></form></dialog>
  <script src="admin.js"></script>
</body>
</html>
